[project]
name = "ziku-litematic-service"
version = "1.0.0"
description = "Convert 128x128 glyph canvases into single-layer Litematica projections."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116.0,<1.0",
    "litemapy==0.11.0b0",
    "pillow>=11.0.0,<13.0.0",
    "python-multipart>=0.0.20,<1.0",
    "uvicorn[standard]>=0.35.0,<1.0",
]

[tool.uv]
package = false
